name: FreeBSD
run-name: ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      commit:
        required: true
        type: string
      request:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: .freebsd-native
          key: freebsd-native-${{ hashFiles('build/Packaging/Linux/build-wgpu-native.sh', 'build/Packaging/Linux/build-glfw-native.sh') }}

      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          mem: 12288
          prepare: |
            pkg install -y bash git cmake rust llvm pkgconf xorgproto libX11 libXext libXrandr libXinerama libXcursor libXi libXcomposite libXdamage libxkbcommon fontconfig freetype2 vulkan-loader mesa-libs sqlite3 libarchive onnxruntime ffmpeg icu libinotify libunwind brotli krb5
          run: |
            set -e
            ROOT="$PWD"
            SDK=dotnet-sdk-10.0.110-freebsd-x64.tar.gz
            SUM=b692f5d559639aee04bcabd1d1e0236060ace16f544f18428f8bb21731519cc2
            fetch -q -o "/tmp/$SDK" "https://github.com/sec/dotnet-core-freebsd-source-build/releases/download/10.0.110-vmr/$SDK"
            [ "$(sha256 -q "/tmp/$SDK")" = "$SUM" ]
            mkdir -p /usr/local/dotnet10
            tar -xzf "/tmp/$SDK" -C /usr/local/dotnet10
            export DOTNET_ROOT=/usr/local/dotnet10 PATH="/usr/local/dotnet10:$PATH" DOTNET_OPENSSL_VERSION_OVERRIDE=35 DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
            sed -i '' 's/"version": "[^"]*"/"version": "10.0.110"/' global.json
            NATIVE="$ROOT/external/LibreWPF/freebsd-x64"
            mkdir -p "$NATIVE" "$ROOT/.freebsd-native" "$ROOT/out"
            cp "$ROOT/.freebsd-native/"* "$NATIVE/" 2>/dev/null || true
            bash build/Packaging/FreeBSD/package.sh '' "$ROOT/out"
            cp "$NATIVE/libwgpu_native.so" "$NATIVE/libglfw.so.3" "$ROOT/.freebsd-native/"
            [ ! -f "$NATIVE/GLFW-LICENSE.txt" ] || cp "$NATIVE/GLFW-LICENSE.txt" "$ROOT/.freebsd-native/"

      - uses: actions/upload-artifact@v4
        with:
          name: voidstrap-freebsd
          path: out/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
